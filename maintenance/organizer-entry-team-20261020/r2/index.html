<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOMEET · Вход и команда · Локальный концепт</title><style>body{margin:0;background:#202020;color:#eee;font:13px system-ui}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px}select,button{font:inherit;background:#303030;color:#eee;border:1px solid #555;border-radius:8px;padding:8px;min-height:36px}.note{font-size:11px;color:#bbb;padding:0 10px 10px;max-width:950px}.stage{display:flex;justify-content:center;overflow:auto}iframe{width:390px;border:1px solid #444;background:#090909;flex-shrink:0}@media(max-width:620px){.stage{justify-content:flex-start}}</style><div class="tools"><b>Вход и команда · локально r2</b><select id="scenario" aria-label="Состояние"></select><label>Ширина <select id="width"><option>320</option><option selected>390</option><option>620</option><option>1100</option></select></label><button id="network">Отключить сеть</button><button id="scan">Скан примера</button><button id="conflict">Конфликт при синхронизации</button><button id="reset">Сбросить</button></div><div class="note">Локальный интерактивный концепт. Все события, пользователи и билеты вымышлены. Камера, права и серверные ответы моделируются. Реальных проходов и приглашений нет; на устройстве сохраняются только условные отметки этого демо.</div><div class="stage"><iframe title="Вход и команда" id="app"></iframe></div><script src="cases.js"></script><script>const q=new URLSearchParams(location.search),s=document.querySelector('#scenario'),w=document.querySelector('#width'),f=document.querySelector('#app'),net=document.querySelector('#network');let online=true;s.innerHTML=ENTRY_CASES.map(c=>`<option value="${c.id}">${c.id} · ${c.label}</option>`).join('');s.value=q.get('case')||'E01';w.value=q.get('width')||'390';function apply(reset=false){online=!['E19','E20','E21','E24'].includes(s.value);net.textContent=online?'Отключить сеть':'Включить
