<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOMEET · Создание события · локальный концепт</title><style>body{margin:0;background:#202020;color:#eee;font:13px system-ui}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px}select,button{font:inherit;background:#303030;color:#eee;border:1px solid #555;border-radius:8px;padding:8px}.note{font-size:11px;color:#bbb;padding:0 10px 10px}.stage{display:flex;justify-content:center;overflow:auto}iframe{width:390px;height:calc(100dvh - 120px);min-height:560px;border:1px solid #444;background:#0a0a0a;flex-shrink:0}@media(max-width:620px){.stage{justify-content:flex-start}}</style><div class="tools"><b>Зал · локальный r7 · варианты кнопок</b><select id="scenario" aria-label="Состояние"></select><label>Ширина <select id="width"><option>320</option><option selected>390</option><option>620</option><option>1100</option></select></label><label>Кнопки <select id="buttons"><option value="compact">Компактные</option><option value="large">Крупные</option></select></label><button id="reset">Сбросить</button></div><div class="note">Демонстрационный просмотр. Реальные события не создаются. Все сценарии условные. Загрузка файлов — только на этом устройстве; проверка и отправка имитируются.</div><div class="stage"><iframe title="Создание события" id="app" src="app.html"></iframe></div><script src="cases.js"></script><script>const q=new URLSearchParams(location.search),s=document.querySelector('#scenario'),w=document.querySelector('#width'),variant=document.querySelector('#buttons'),frame=document.querySelector('#app');s.innerHTML=window.CREATE_CASES.map(c=>`<option value="${c.id}">${c.id} · ${c.label}</option>`).join('');s.value=q.get('case')||'C01';w.value=q.get('width')||'390';variant.value=q.get('buttons')||'compact';function apply(){frame.style.width=w.value+'px';frame.src='app.html?case='+s.value+'&buttons='+variant.value;history.replaceState(null,'','?case='+s.value+'&width='+w.value+'&buttons='+variant.value)}s.onchange=apply;variant.onchange=apply;w.onchange=()=>{frame.style.width=w.value+'px';history.replaceState(null,'','?case='+s.value+'&width='+w.value+'&buttons='+variant.value)};document.querySelector('#reset').onclick=apply;apply();function resizePreview(){frame.style.height=Math.max(320,innerHeight-document.querySelector('.stage').getBoundingClientRect().top-2)+'px';frame.style.minHeight='0'};window.addEventListener('resize',resizePreview);new ResizeObserver(resizePreview).observe(document.querySelector('.tools'));resizePreview();</script>
