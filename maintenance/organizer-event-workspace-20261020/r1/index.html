<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOMEET · Кабинет, редактор и архив · Локально</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e6df;color:#292d23;font:13px/1.45 system-ui,sans-serif}.tools{max-width:1000px;margin:auto;padding:14px 18px 10px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:9px}.top strong{font-size:16px}.tag{font-size:11px;padding:3px 7px;border:1px solid #b6beaa;border-radius:7px;white-space:nowrap}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:7px 0}button,select{font:inherit;color:inherit;background:#f9f8f3;border:1px solid #c3c9b8;border-radius:8px;min-height:34px;padding:6px 10px;cursor:pointer}select{min-width:140px;flex:1;max-width:100%}button[aria-pressed=true]{background:#293222;color:#fff;border-color:#293222}details{font-size:12px;margin:8px 0}summary{cursor:pointer;color:#566149;min-height:26px}.note{font-size:11px;color:#59654d;margin:7px 0}.stage{display:flex;overflow:auto;justify-content:flex-start;padding:0 10px 18px}iframe{box-sizing:content-box;flex:0 0 auto;width:390px;height:max(650px,calc(100vh - 210px));border:1px solid #a4ad97;border-radius:20px;background:#0a0a0a;box-shadow:0 18px 40px #263c1219;margin-inline:auto}.state{font-size:11px;color:#59654d;min-height:17px}.boundary{background:#f7faf2;border:1px solid #b1bea0;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:10px}.boundary[hidden]{display:none}.boundary button{font-size:11px;min-height:26px;padding:3px 8px;margin-left:8px}a{color:#485b2f}button:focus-visible,select:focus-visible{outline:2px solid #5c7538;outline-offset:2px}.subtle{font-size:11px;color:#69745e}.compact button{font-size:11px;min-height:28px;padding:4px 7px}.compact select{font-size:11px;min-height:30px}</style></head><body><section class="tools" aria-label="Панель просмотра локальных концептов"><div class="top"><strong>Кабинет · редактор · архив</strong><span class="tag">Только локально</span></div><div class="row"><select id="scenario" aria-label="Сценарий — перезапускает пример"></select><button data-width="320">320</button><button data-width="390">390</button><button data-width="620">620</button></div><div class="row"><button data-case="K01">Кабинет</button><button data-case="E02">Редактор</button><button data-case="A01">Архив</button><button data-case="K03">Идёт сейчас</button></div><div id="state" class="state" aria-live="polite"></div><details id="simulation"><summary>Сценарии операций и время</summary><p class="note">Данные вымышленные. Выбор сценария перезапускает пример. Сохранение действует только в памяти этого просмотра.</p><div class="row compact"><select id="outcome" aria-label="Результат следующего сохранения"><option value="success">Сохранение: успех</option><option value="pending">Сохранение: на проверке</option><option value="error">Сохранение: ошибка</option><option value="upload-error">Ошибка загрузки афиши</option><option value="unknown">Ответ не получен</option><option value="conflict">Конфликт правок</option><option value="access">Доступ потерян</option><option value="archive">Событие стало архивным</option></select><button id="complete">Завершить операцию / загрузку</button><button id="recover">Восстановить доступ</button></div><div class="row compact"><span id="clock"></span><button data-time="1">+1 мин</button><button data-time="60">+1 час</button><button data-time="20160">+14 дней</button><button id="reset">Перезапустить сценарий</button></div></details><div id="boundary" class="boundary" hidden></div></section><div class="stage"><iframe id="phone" title="Локальные концепты кабинета, редактора и архива"></iframe></div><script type="module">
import{scenarios,NOW}from'./model.mjs';
const q=new URLSearchParams(location.search);let caseId=q.get('case')||'K01',width=[320,390,620].includes(+q.get('width'))?+q.get('width'):390,minutes=0,ready=false,pendingUrl='';
const picker=document.querySelector('#scenario'),phone=document.querySelector('#phone'),outcome=document.querySelector('#outcome');
picker.innerHTML=[...new Set(scenarios.map(s=>s.group))].map(g=>`<optgroup label="${g}">${scenarios.filter(s=>s.group===g).map(s=>`<option value="${s.id}">${s.id} · ${s.title}</option>`).join('')}</optgroup>`).join('');
function send(value){phone.contentWindow?.postMessage(value,location.origin)}
function clock(){document.querySelector('#clock').textContent=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}).format(NOW+minutes*60000)+' мск'}
function saveUrl(){history.replaceState(null,'','?'+new URLSearchParams({case:caseId,width}))}
function load(){ready=false;phone.src=pendingUrl;pendingUrl=''}
function show(){const s=scenarios.find(s=>s.id===caseId)||scenarios.find(s=>s.id==='K01');caseId=s.id;picker.value=caseId;minutes=0;outcome.value=s.flags.outcome||'success';document.querySelector('#boundary').hidden=true;phone.style.width=width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.width===width));document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.case===caseId));pendingUrl='app.html?case='+caseId;clock();saveUrl();if(ready)send({type:'workspace-reset'});else load()}
picker.onchange=()=>{caseId=picker.value;show()};document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{caseId=b.dataset.case;show()});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=+b.dataset.width;phone.style.width=width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.width===width));saveUrl()});
outcome.onchange=()=>send({type:'workspace-outcome',outcome:outcome.value});document.querySelector('#complete').onclick=()=>send({type:'workspace-complete'});document.querySelector('#recover').onclick=()=>send({type:'workspace-recover'});document.querySelector('#reset').onclick=show;document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{minutes+=+b.dataset.time;send({type:'workspace-clock',minutes});clock()});
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==phone.contentWindow)return;const d=e.data;if(d.type==='workspace-reset-ready'){load();return}if(d.type==='workspace-state'){ready=true;document.querySelector('#state').textContent=({workspace:'Кабинет события',edit:'Редактирование',archive:'Архивный кабинет',list:'Принятый список событий'}[d.view]||d.view)+(d.dirty?' · Есть несохранённые правки':'')+(d.saving?' · Операция выполняется':'')+(d.quotaSaving?' · Лимит сохраняется отдельно':'');return}if(d.type==='workspace-boundary'){const el=document.querySelector('#boundary');el.replaceChildren(document.createTextNode('Переход: '+d.name+'. Это соседний раздел; здесь проработаны кабинет, редактор и архив. Данные не отправляются на сервер.'));const b=document.createElement('button');b.textContent='Закрыть';b.onclick=()=>el.hidden=true;el.append(b);el.hidden=false}});show();
</script></body></html>
