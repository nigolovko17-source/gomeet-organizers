<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOMEET · Мои события · Локальный концепт</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e6df;color:#272923;font:13px/1.45 system-ui,sans-serif}.tools{max-width:920px;margin:auto;padding:14px 18px 12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.top strong{font-size:16px}.tag{font-size:11px;border:1px solid #b7bbae;padding:3px 7px;border-radius:7px;white-space:nowrap}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}button,select{font:inherit;border:1px solid #c8c9bf;border-radius:8px;padding:7px 10px;background:#f9f8f3;color:#292b25;cursor:pointer;min-height:34px}button[aria-pressed=true]{background:#262b20;color:white;border-color:#262b20}select{flex:1;min-width:170px}.note{margin:8px 0 0;color:#5f6359;font-size:12px;min-height:34px}.clock{font-size:11px;color:#626659}.clock button{font-size:11px;padding:3px 7px;min-height:27px}.stage{display:flex;justify-content:flex-start;overflow-x:auto;padding:0 10px 20px}iframe{box-sizing:content-box;flex:0 0 auto;margin-inline:auto;width:390px;height:max(660px,calc(100vh - 220px));border:1px solid #a3a89a;border-radius:20px;background:#0a0a0a;box-shadow:0 16px 40px #19250c18}.boundary{background:#fff;border:1px solid #bfc6b4;border-radius:10px;padding:10px 12px;margin-top:10px}.boundary[hidden]{display:none}.boundary button{padding:3px 8px;font-size:12px;min-height:28px;margin-left:8px}a{color:#475a26}button:focus-visible,select:focus-visible{outline:2px solid #53672d;outline-offset:2px}</style></head><body><section class="tools" aria-label="Панель просмотра концепта"><div class="top"><strong>Мои события · концепт</strong><span class="tag">Только локально</span></div><div class="row"><select id="scenario" aria-label="Сценарий"></select><button data-width="320">320</button><button data-width="390">390</button><button data-width="620">620</button></div><div class="row"><button data-scenario="upcoming">До начала</button><button data-scenario="live">Идёт сейчас</button><button data-scenario="archive">Архив</button><button data-scenario="overview">Вся страница</button></div><p id="note" class="note"></p><div class="row clock"><span id="time"></span><button data-minutes="60">+1 час</button><button data-minutes="20160">+14 дней</button><button id="reset">Сброс времени</button></div><div id="boundary" class="boundary" hidden></div></section><div class="stage"><iframe id="phone" title="Локальный концепт страницы Мои события"></iframe></div><script type="module">
import{scenarios,NOW}from'./model.mjs';
const q=new URLSearchParams(location.search);let id=q.get('scenario')||'overview',width=[320,390,620].includes(+q.get('width'))?+q.get('width'):390,minutes=Number(q.get('offset'))||0;
const picker=document.querySelector('#scenario'),phone=document.querySelector('#phone');picker.innerHTML=scenarios.map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
function clock(){document.querySelector('#time').textContent='Время в концепте: '+new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}).format(NOW+minutes*60000)+' мск'}
function save(){const p=new URLSearchParams({scenario:id,width,offset:minutes});history.replaceState(null,'','?'+p)}
function show(){const s=scenarios.find(s=>s.id===id)||scenarios[0];id=s.id;picker.value=id;document.querySelector('#note').textContent=s.note;phone.src=`page.html?scenario=${id}&offset=${minutes}`;phone.style.width=width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.width===width));document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scenario===id));document.querySelector('#boundary').hidden=true;clock();save()}
picker.onchange=()=>{id=picker.value;minutes=0;show()};document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>{id=b.dataset.scenario;minutes=0;show()});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=+b.dataset.width;phone.style.width=width+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.width===width));save()});
document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>{minutes+=+b.dataset.minutes;phone.contentWindow.postMessage({type:'concept-clock',minutes},location.origin);clock();save()});document.querySelector('#reset').onclick=()=>{minutes=0;show()};
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==phone.contentWindow)return;if(e.data.type==='concept-boundary'){const el=document.querySelector('#boundary');el.replaceChildren(document.createTextNode('Переход: '+e.data.name+'. Дочерний экран не входит в этот концепт; действие не сохраняет данные. '));const b=document.createElement('button');b.textContent='Закрыть';b.onclick=()=>el.hidden=true;el.append(b);el.hidden=false}});show();
</script></body></html>
