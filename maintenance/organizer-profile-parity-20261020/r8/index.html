<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Я организатора · локальные дополнения .ru</title><style>*{box-sizing:border-box}body{margin:0;background:#202020;color:#eee;font:13px system-ui}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #444}.tools b{margin-right:auto}select,button,input{font:inherit;background:#303030;color:#eee;border:1px solid #555;border-radius:8px;padding:7px}button{cursor:pointer}.note{padding:7px 16px;color:#bdbdb5;font-size:11px}.stage{display:flex;justify-content:center;padding:10px 0}iframe{display:block;width:390px;height:calc(100vh - 122px);min-height:500px;border:0;background:#0a0a0a;box-shadow:0 0 0 1px #555}a{color:#eee}@media(max-width:620px){.tools{padding:8px}.tools b{width:100%}.note{padding:7px 8px}.stage{justify-content:flex-start;overflow:auto}}</style>
<div class="tools"><b>«Я» организатора · стиль .ru сохранён</b><label>Экран <select id="page"><option value="profile">Профиль .ru</option><option value="company">Сведения и статус</option><option value="bank">Реквизиты</option><option value="contracts">Документы</option><option value="limits">Условия и ограничения</option><option value="contact">Почта аккаунта</option><option value="consents">Приватность и согласия</option><option value="followers">Подписчики</option><option value="logout">Выход</option></select></label><label>Состояние <select id="scenario"><option value="normal">Полностью подключён</option><option value="guest-pending">Пользователь · заявка на рассмотрении</option><option value="profile-approved">Я · заявка одобрена</option><option value="profile-bank">Я · реквизиты — последний этап</option><option value="profile-review">Я · данные на проверке</option><option value="profile-correction">Я · нужны уточнения</option><option value="profile-documents">Я · остались документы</option><option value="profile-waiting">Я · завершаем подключение</option><option value="profile-loading">Я · загрузка статуса</option><option value="profile-error">Я · ошибка статуса</option><option value="preparing">Подготовка</option><option value="reviewing">На рассмотрении</option><option value="needs_information">Нужны уточнения</option><option value="reviewed">Проверка завершена</option><option value="rejected">Отказ</option><option value="error">Ошибка загрузки</option><option value="loading">Загрузка</option><option value="denied">Нет доступа</option><option value="followers">Подписчики · пример списка</option><option value="documents">Документ · пример редакции</option><option value="document-error">Ошибка документов</option><option value="bank-review">Счёт на проверке</option><option value="bank-rejected">Исправление реквизитов</option><option value="save-error">Ошибка сохранения</option><option value="unknown">Ответ сохранения неизвестен</option><option value="unknown-saved">Проверка подтвердила сохранение</option><option value="contact-error">Ошибка почты</option><option value="diagnostics-error">Ошибка выбора согласия</option></select></label><label>Ширина <select id="width"><option>320</option><option selected>390</option><option>620</option></select></label><button id="reset">Сбросить</button></div><div class="note">Только локально. Новые разделы работают на демонстрационных данных в памяти. Запись на сервер в этом просмотре отключена. Панель сценариев не входит в интерфейс продукта.</div><div id="handoff" role="status" style="display:none;padding:10px 16px;background:#303026;border-bottom:1px solid #555"></div><div class="stage"><iframe id="app" title="Профиль организатора .ru с локальными дополнениями" src="preview.html"></iframe></div>
<script>
const app=document.querySelector('#app'),page=document.querySelector('#page'),scenario=document.querySelector('#scenario'),width=document.querySelector('#width'),params=new URLSearchParams(location.search);page.value=params.get('page')||'profile';scenario.value=params.get('scenario')||'normal';width.value=params.get('width')||'390';app.style.width=width.value+'px';let ready=false;
function send(reset=false){document.querySelector('#handoff').style.display='none';if(!ready)return;app.contentWindow.postMessage({type:'profile-parity-control',scenario:scenario.value,...(page.value!=='profile'?{page:page.value}:{}),reset},location.origin)}
function url(){history.replaceState(null,'','?page='+page.value+'&scenario='+scenario.value+'&width='+width.value)}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===app.contentWindow&&e.data?.type==='profile-stage-next'){const note=document.querySelector('#handoff');note.style.display='block';note.textContent='Переход: '+e.data.action+'. Это граница макета: страницы подтверждения и дальнейшие действия пока не разрабатываются.';return}if(e.origin===location.origin&&e.source===app.contentWindow&&e.data?.type==='profile-parity-ready'){ready=true;send()}});page.onchange=()=>{if(page.value!=='profile'&&scenario.value.startsWith('profile-'))scenario.value='normal';url();if(page.value==='profile'){ready=false;app.src='preview.html?reload='+Date.now()}else send()};scenario.onchange=()=>{if(scenario.value.startsWith('profile-')||scenario.value==='guest-pending')page.value='profile';url();send()};width.onchange=()=>{app.style.width=width.value+'px';url()};document.querySelector('#reset').onclick=()=>{ready=false;app.src='preview.html?reset='+Date.now()};
</script></html>
